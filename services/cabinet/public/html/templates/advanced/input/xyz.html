<div class='xyz-input' set-name='{{label}}'>
  <h3 class='inline-flex chev-dropdown-toggle'>
    {{label}}
    <i class='down gg-chevron-down hidden' ></i>
    <i class='right gg-chevron-right'></i>
  </h3>
  <div class='tab chev-dropdown' hidden>
    <input type='measurement' name='x' decimal='{{x}}'>
    <input type='measurement' name='y' decimal='{{y}}'>
    <input type='measurement' name='z' decimal='{{z}}'>
  </div>
</div>
