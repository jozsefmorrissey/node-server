<table>
  <tr>
    <th></th>
    <th>i</th>
    <th>j</th>
    <th>k</th>
    <th>Calculated</th>
    <th>Value</th>
  </tr>
  <tr:t index="{{$index}}" repeat="i, label in ['Cross Grain', 'With Grain', 'End Grain']"
          class='tab normal-vector-input-cnt'>
    <td><label>{{label}}</label></td>
      <td:t repeat='k in 0..3'>
        <input class='template-input dem' attr='subassemblies' short
                value="{{part.config.NORMALS.vectors[i][j]}}"
                {{part.config.NORMALS.calc === i ? 'disabled' : ''}}>
      </td:t>
    <td>
      <input type='radio' name='calculated' class='calc-vect-radio'
        {{part.config.NORMALS.calc === i ? 'checked' : ''}}>
    </td>
  </tr:t>
</table>
