<table class='borderless'>
  <tbody class='borderless' lookup-id='{{id()}}'>
    <tr:t repeat='inputTree in inputTrees()' class='color-cnt'>
      <td class='borderless'>
        <input type='color' value='{{inputTree.color()}}' original='{{inputTree.color()}}'>
      </td>
      <td class='color-input-tree-cnt' hidden>{{inputTree.html()}}</td>
    </tr:t>
  </tbody>
</table>
