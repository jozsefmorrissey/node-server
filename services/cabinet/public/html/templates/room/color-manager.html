<div lookup-id='{{id()}}' class='inline-flex'>
  <span:t class='color-cnt borderless' repeat='inputTree in inputTrees()'>
    <input type='color' value='{{inputTree.color()}}' original='{{inputTree.color()}}' class='big'>
    <td class='color-input-tree-cnt' hidden>{{inputTree.html()}}</td>
  </span:t>
</div>
