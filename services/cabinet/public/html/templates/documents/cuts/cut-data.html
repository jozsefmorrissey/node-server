<tr>
  <td>{{cut.id}}</td>
  <td>{{cut.marker && cut.marker.label}}</td>
  <td>{{disp.axis.x(cut.axis)}}</td>
  <td>{{disp.axis.z(cut.axis)}}</td>
  <td>{{disp.roundTo(cut.tilt) || ''}}</td>
  <td>{{disp.angle(cut, 'z')}}<br/>{{disp.angle(cut, '-z')}}</td>
  <td>
    <span:t repeat='er in cut.locationRef.references'>
      <div:t class='tab' $t-id='documents/cuts/cut-{{er[0].label ? "edge" : "point"}}-ref'>er</div:t>
      <br/>
    </span:t>
  </td>
  <td>{{disp.axis.y(cut.axis)}}</td>
</tr>
