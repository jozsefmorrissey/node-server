<div class='small-margin last-col-full '>
    <table>
      <tbody>
        <tr class='btm-border-barely-visible'>
          <th>Qt</th>
          <th>{{width}}</th>
          <th>{{height}}</th>
          <th>{{thickness}}</th>
          <th>Style</th>
          <th>Location</th>
          <th>Notes</th>
        </tr>
        <tr:t repeat='doorObj in partListMap[type]' {{!partListMap[type] ? 'hidden' : ''}}
               class='btm-border-barely-visible'>
          <td>{{disp.material.qty(doorObj.info)}}</td>
          <td>{{disp.measurement(doorObj.info.demensions.x)}}</td>
          <td>{{disp.measurement(doorObj.info.demensions.y)}}</td>
          <td>{{disp.measurement(doorObj.info.demensions.z)}}</td>
          <td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</td>
          <td>{{disp.sectionLocation(doorObj)}}</td>
          <td></td>
        </tr:t>
      </tbody>
    </table>
</div>
