<div class='poly-input-cnt'>
  <label>Thickness</label>
  <input class='template-input measurement-display' attr='subassemblies' name='polyConfig.thickness' value='{{subAssem.polyConfig.thickness}}'>
  <input disabled class='measurement-input' name='value'>
  <br>
  <label>Points</label>
  <div:t repeat='point in subAssem.polyConfig.points' index='{{$index}}'>
    {{selector.vertex('').html()}}
    <input class='template-input xyz' attr='subassemblies' name='polyConfig.points.{{$index}}' value='{{point[0]}}'>
    <input disabled class='measurement-input' name='value'>
    <input type="checkbox" name="convert" checked>
    <button class="remove-btn smaller" key="0">X</button>
  </div:t>
  <button class='add-poly-point'>Add</button>
</div>
