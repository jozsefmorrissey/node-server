<div class='opening-cnt' opening-id='{{opening.id()}}'>
  <label layout-target-id='{{opening.isRoot() ? '' : opening.parentAssembly().id()}}'>
    parent
  </label>
  <b class='copy-inner-text'>{{opening.name()}}</b>
  <div class='divider-controls'>
    {{OpenSectionDisplay.dividerHtml(opening)}}
  </div>
  <div>
    {{Inputs.sectionType(opening).html()}}
    <div class='section-feature-cnt'>
      <div class='inline-flex chev-dropdown-toggle'>
        Opening Features
        <i class='down gg-chevron-down hidden' ></i>
        <i class='right gg-chevron-right'></i>
      </div>
      <div class='tab chev-dropdown' hidden>
        {{featuresHtml}}
      </div>
    </div>
    <div:t t-id='section-children-cnt' id='section-children-cnt'
          class='{{opening.vertical() ? '' : 'inline-flex'}}'>
      <div:t class='has-siblings child-section'
              repeat='section in opening.sections'
              layout-target-id='{{section.id()}}'>
        {{section.coverType.sentance()}}
      </div:t>
    </div:t>
  </div>
</div>
