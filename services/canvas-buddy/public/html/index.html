<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <script type="text/javascript" src='/canvas-buddy/js/index.js'></script>
    <link rel="stylesheet" href="/styles/expandable-list.css">
    <link rel="stylesheet" href="/styles/icons.css">
    <link rel="stylesheet" href="/canvas-buddy/styles/index.css">
    <style>
      .inline-flex{ display: inline-flex}
      .player-controls td {
        padding: 0 10pt;
      }
      .fill-available {
        width: -webkit-fill-available;
      }
      textarea {
        border-color: grey;
        outline: none;
      }
      canvas {background-color: whitesmoke;}
    </style>
    <title>canvas-buddy</title>
  </head>
  <body>
    <div class='inline-flex'>
      <div>
        <div>
          <div class='center'>
            <label>2D</label>
            <input type='radio' name='parcer' value='2D'>
            <label>3D</label>
            <input type='radio' name='parcer' value='3D' checked>
            <input type='number' name='scale' placeholder="Scale">
          </div>
          <div class="inline-flex center fill-available">
            <table class='player-controls center' hidden>
              <tbody>
                <tr>
                  <td><i class="gg-play previous"></i></td>
                  <td><i class="gg-play rewind"></i></td>
                  <td><i class="gg-play button o"></i></td>
                  <td hidden><i class="gg-play pause o"></i></td>
                  <td><i class="gg-play fast-forward"></i></td>
                  <td><i class="gg-play next"></i></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id='snap-shot-comment-cnt'></div>
          <textarea rows='40' cols='50' wrap='off'></textarea>
        </div>
      </div>
      <div>
        <div id='two-d-display' hidden>
          <span>
            <label>Measurement</label>
            <input type='checkbox'>
          </span>
          <br>
          <label>Line Display:</label>
          <div class='tab' id='display-radios-2d'>
            <label>Line Only</label>
            <input type='radio' name='line-disp-type-2d' value='LINE_ONLY' checked>
            <label>Vector</label>
            <input type='radio' name='line-disp-type-2d' value='VECTOR'>
          </div>
          <canvas></canvas>
        </div>
        <div id='three-d-display'>
          <div class='orientation-controls'></div>
          <div>
            <label>STL</label>
            <input type='file' name='stlFile' multiple>
            <div id='stl-list-cnt' class='tab'></div>
            <label>Line Display:</label>
            <div class='tab'>
              <div  id='axis-controls-3d'>
                <label>Axis</label>
                <input type='checkbox' checked name='include'>
                <span class='rad-len-cnt'>
                  <label>Length</label>
                  <input type='number' value='100' name='length'>
                  <label>Radius</label>
                  <input type='number' value='1' name='radius'>
                </span>
              </div>
              <div id='display-radios-3d'>
                <label>Vector</label>
                <input type='radio' name='line-disp-type' value='VECTOR' checked>
                <label>Points</label>
                <input type='radio' name='line-disp-type' value='POINTS'>
                <label>Line Only</label>
                <input type='radio' name='line-disp-type' value='LINE_ONLY'>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
