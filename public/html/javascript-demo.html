<script>
  const header = document.querySelector('h1');
  header.innerText = 'Hello World';
  const table = document.querySelector('table');
  const ageRangeData = {};

  function roughSizeOfObject(object) {
    const objectList = [];
    const stack = [object];
    const bytes = [0];
    while (stack.length) {
      const value = stack.pop();
      if (value == null) bytes[0] += 4;
      else if (typeof value === 'boolean') bytes[0] += 4;
      else if (typeof value === 'string') bytes[0] += value.length * 2;
      else if (typeof value === 'number') bytes[0] += 8;
      else if (typeof value === 'object' && objectList.indexOf(value) === -1) {
        objectList.push(value);
        if (typeof value.byteLength === 'number') bytes[0] += value.byteLength;
        else if (value[Symbol.iterator]) {
          // eslint-disable-next-line no-restricted-syntax
          for (const v of value) stack.push(v);
        } else {
          Object.keys(value).forEach(k => {
             bytes[0] += k.length * 2; stack.push(value[k]);
          });
        }
      }
    }
    return bytes[0];
  }

  function displayAgeData(newEntries) {
    Array.from(table.querySelectorAll('tr.cell') || []).forEach(tr => tr.remove());
    newEntries.forEach(entry => {
      const lower = Math.floor(entry.age / 10) * 10;
      const ageRange = `${lower}-${lower + 9}`;
      if (ageRangeData[ageRange] === undefined) ageRangeData[ageRange] = 0;
      ageRangeData[ageRange]++;
    });

    Object.keys(ageRangeData).sort((k1, k2) => Number.parseInt(k1) - Number.parseInt(k2))
          .forEach(k => {
            const tr = document.createElement('tr');
            tr.classList = 'cell';
            tr.innerHTML = `<td>${k}</td>
            <td>${ageRangeData[k]}</td>`;
            table.append(tr);
          });
  }


  const reductionFactor = 10
  const usPop = 340000000 / reductionFactor;
  const db = [];

  const peopleLimit = 100000;
  let calls = 0;
  const addPeopleAsync = (...args) => setTimeout(() => addPeople(...args), calls++*300);
  function addPeople(startAge, popSize) {
    if (popSize > 1000000) {
      let created = 0;
      while (created < popSize) {
        let create;
        if (popSize - created < peopleLimit)
          create = popSize - created;
        else create = randInt(peopleLimit);
        addPeopleAsync(startAge, create);
        created += create;
      }
    } else {
      const newEntries = [];
      for (let j = 0; j < popSize; j++) {
        const age = randInt(10) + startAge;
        const nameIndex = randInt(names.length);
        db.push([age,nameIndex]);
        newEntries.push({age,nameIndex});
      }
      console.log('Disp Data')
      displayAgeData(newEntries);
    }
  }


  const randInt = (limit) => Math.floor(Math.random() * limit);
  for (let index = 0; index < ssAgeDataInit.length; index++) {
    const popSize = ssAgeDataInit[index] / reductionFactor;
    const startAge = index * 10;
    setTimeout(() => addPeople(startAge, popSize), index);
  }

  const ssSize = db.length;
  console.log(ssSize + '/' + usPop);
</script>
